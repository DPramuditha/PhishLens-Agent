name: PhishLens Agent CI — Continuous Integration

on:
  push:
    branches:
      - main
      - master
      - develop
      - dev
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - master
      - develop
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read

jobs:
 
  # 1. Backend Testing & Code Quality Pipeline
  
  backend-tests:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    env:
      DJANGO_SETTINGS_MODULE: backend.settings
      DEBUG: 'True'
      SECRET_KEY: 'ci-secret-test-key-phishlens-agent-1234567890'
      JWT_SECRET: 'ci-jwt-secret-key-phishlens-agent-1234567890'
      DB_ENGINE: 'django.db.backends.sqlite3'
      DB_NAME: ':memory:'

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install Python Dependencies & Test Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest-cov flake8

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Validate Django Configuration
        run: |
          python manage.py check

      - name: Run Python Linting & Syntax Check (Flake8)
        run: |
          # Stop the build on syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat other stylistic issues with report
          flake8 backend --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Apply Database Migrations
        run: |
          python manage.py migrate --no-input

      - name: Run All Pytest Suites with Coverage
        run: |
          pytest -v \
            --junitxml=backend-test-results-${{ matrix.python-version }}.xml \
            --cov=backend \
            --cov-report=xml:backend-coverage-${{ matrix.python-version }}.xml \
            --cov-report=term

      - name: Upload Backend Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-py${{ matrix.python-version }}
          path: backend-test-results-${{ matrix.python-version }}.xml
          if-no-files-found: warn

      - name: Upload Backend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report-py${{ matrix.python-version }}
          path: backend-coverage-${{ matrix.python-version }}.xml
          if-no-files-found: warn

 
  # 2. Frontend Testing, Linting & Build Verification
  
  frontend-tests:
    name: Frontend Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: Run ESLint Checks
        run: |
          npx eslint . --max-warnings=20

      - name: Run All Vitest Suites
        run: |
          npm run test -- --reporter=verbose --reporter=junit --outputFile=frontend-test-results-${{ matrix.node-version }}.xml

      - name: Build Production Frontend Bundle
        run: |
          npm run build

      - name: Upload Frontend Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results-node${{ matrix.node-version }}
          path: frontend/frontend-test-results-${{ matrix.node-version }}.xml
          if-no-files-found: warn

      - name: Upload Frontend Production Build Dist
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-bundle
          path: frontend/dist
          if-no-files-found: error


  # 3. Security & Dependency Vulnerability Audits
 
  security-audit:
    name: Security & Vulnerability Audits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python for pip-audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python Dependency Security Scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || echo "::warning::Vulnerabilities flagged by pip-audit"

      - name: Set up Node.js for npm audit
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Run Frontend NPM Audit
        working-directory: frontend
        run: |
          npm audit --audit-level=critical || echo "::warning::Critical vulnerabilities flagged in npm audit"

      - name: Secret Leak Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  
  # 4. Docker Build & Container Verification

  docker-verification:
    name: Docker Build & Compose Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yml Config
        run: |
          docker compose config

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: phishlens-agent-backend:test
          load: true

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: phishlens-agent-frontend:test
          load: true


  # 5. CI Pipeline Summary & Badge Reporter

  ci-summary:
    name: CI Pipeline Status Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, security-audit, docker-verification]
    if: always()

    steps:
      - name: Generate Pipeline Summary Report
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🛡️ PhishLens Agent CI Pipeline Summary

          | Job Component | Status | Details |
          |:---|:---:|:---|
          | **Backend Tests (Pytest)** | ${{ needs.backend-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} | 180 Pytest suites across Python 3.11, 3.12, 3.13 |
          | **Frontend Tests (Vitest)** | ${{ needs.frontend-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} | 44 Vitest suites across Node 20.x, 22.x & Production Build |
          | **Security Audits** | ${{ needs.security-audit.result == 'success' && '✅ Passed' || '⚠️ Warnings' }} | pip-audit, npm audit, Gitleaks scan |
          | **Docker Verification** | ${{ needs.docker-verification.result == 'success' && '✅ Passed' || '❌ Failed' }} | Backend & Frontend Docker images & docker-compose |

          ---
          *PhishLens Agent — Autonomous Multi-Agent Phishing Detection Platform*
          EOF
